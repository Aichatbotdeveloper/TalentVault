name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key-not-a-secret
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-key-not-a-secret
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build

  integration:
    name: Supabase integration + E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Start local Supabase (applies migrations)
        run: npx supabase start -x studio,imgproxy,vector,logflare,edge-runtime,realtime,supavisor,postgres-meta
      - name: Write .env.local from the local stack
        run: |
          eval "$(npx supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
            echo "AI_PROVIDER=local"
            echo "EMAIL_PROVIDER=console"
            echo "CRON_SECRET=ci-cron-secret"
            echo "IP_HASH_SALT=ci-salt"
          } > .env.local
      - run: npm run seed
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: E2E (production build)
        run: |
          npm start -- -p 3000 &
          npx wait-on http://localhost:3000 --timeout 120000
          E2E_BASE_URL=http://localhost:3000 npm run test:e2e
