<div style="font-family:Inter,Arial,sans-serif;max-width:520px;margin:0 auto;padding:32px;color:#191c20">
  <div style="font-weight:800;font-size:20px;color:#1a6840;margin-bottom:24px">TalentVault</div>
  <h2 style="font-size:20px;margin:0 0 12px">Reset your password</h2>
  <p style="font-size:15px;line-height:1.6;color:#404941">We received a request to reset the password for your TalentVault account.</p>
  <p style="margin:28px 0"><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/auth/update-password" style="background:#1a6840;color:#fff;text-decoration:none;padding:12px 22px;border-radius:9999px;font-weight:600;display:inline-block">Choose a new password</a></p>
  <p style="font-size:12px;color:#646464">If you did not request this, you can ignore this email.</p>
</div>
